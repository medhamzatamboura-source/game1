<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>PING RUNNER – NOC World Tour</title>
<style>
:root{--bg:#03050b;--panel:#0d1630;--panel2:#0a1226;--line:#22335f;--ink:#e8f0ff;--mut:#8da2c8;--acc:#37e6a0;--warn:#ffb020;--bad:#ff4d6d;--blue:#38e1ff;--p2:#ff5ad0}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","Noto Sans CJK SC","Noto Sans Arabic","Noto Sans Devanagari",sans-serif}
#wrap{max-width:1100px;margin:0 auto;padding:8px 10px 16px;display:flex;flex-direction:column;align-items:center;gap:8px}
canvas{width:100%;aspect-ratio:3/2;display:block;background:#03050b;border:1px solid var(--line);border-radius:12px;touch-action:none}
.pads{display:flex;gap:12px;width:100%;justify-content:space-between}
.pad{display:flex;gap:8px;flex:1;max-width:420px;align-items:center}
.pad .who{font-weight:800;min-width:0}
#pad1 .who{color:var(--blue)}#pad2 .who{color:var(--p2)}
.pad button{flex:1;font-size:24px;padding:12px 0;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--ink);touch-action:manipulation;user-select:none;-webkit-user-select:none}
.pad button:active{background:#1b2c57}
#pad2{justify-content:flex-end}
.ov{position:fixed;inset:0;display:none;align-items:flex-start;justify-content:center;padding:14px;background:rgba(2,4,10,.88);overflow:auto;z-index:5}
.box{width:100%;max-width:880px;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px 22px;margin:auto}
.box h1{margin:0;font-size:30px;letter-spacing:1px;background:linear-gradient(90deg,#38e1ff,#37e6a0,#ffd24d);-webkit-background-clip:text;background-clip:text;color:transparent}
.box h2{margin:0 0 6px;font-size:24px}
.box h3{margin:16px 0 8px;font-size:15px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em}
.box p{line-height:1.5;margin:8px 0}
.sub{color:var(--mut);font-size:13px}
.mhead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.langs{display:flex;gap:6px}
.lg,.md{border:1px solid var(--line);background:var(--panel2);color:var(--ink);border-radius:10px;padding:8px 12px;font-size:14px;cursor:pointer}
.lg.on,.md.on{border-color:var(--acc);background:#0d2a22;color:#bfffe6;font-weight:700}
.modes{display:flex;gap:8px;flex-wrap:wrap}
.modes .md{flex:1;min-width:180px;padding:12px}
.names{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.names label{flex:1;min-width:200px;display:flex;align-items:center;gap:8px}
.names input{flex:1;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);font-size:15px}
.route{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px}
.as{display:flex;flex-direction:column;border:1px solid;border-radius:10px;padding:6px 9px;background:var(--panel2);min-width:96px}
.as small{color:var(--mut);font-size:11px}.as i{font-style:normal;font-size:11px;color:#ffd9a0;margin-top:2px}
.arr{color:var(--mut)}
.ctl p{margin:4px 0;font-size:14px}
kbd{display:inline-block;min-width:20px;padding:1px 6px;border:1px solid #3a4f86;border-bottom-width:3px;border-radius:6px;background:#111b38;font-family:inherit;font-size:12px;text-align:center}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;font-size:13px}
.legend div{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 9px;line-height:1.4}
.legend div.good{border-color:#1f5a47}
.legend span{display:inline-block;width:24px;font-size:16px}
.btn{display:block;width:100%;margin:14px 0 4px;padding:13px;border-radius:12px;border:0;background:linear-gradient(90deg,#1c7be0,#37e6a0);color:#04101a;font-weight:800;font-size:17px;cursor:pointer}
.btn.alt{background:var(--panel2);color:var(--ink);border:1px solid var(--line)}
.row2{display:flex;gap:10px}.row2 .btn{flex:1}
table{width:100%;border-collapse:collapse;font-size:14px;margin:10px 0}
td,th{padding:7px 9px;border-bottom:1px solid var(--line);text-align:left}
th{color:var(--mut)}
td.win{color:var(--acc);font-weight:800}td.lose{color:#ff8fa3}
tr.qs td{font-size:17px;font-weight:800}
pre{background:#02040a;border:1px solid var(--line);border-radius:10px;padding:10px;font-size:11.5px;overflow:auto;color:#9dffcf;white-space:pre;font-family:ui-monospace,Menlo,Consolas,"Noto Sans Mono",monospace}
details{margin:8px 0}summary{cursor:pointer;font-weight:800}
.exp{background:var(--panel2);border-left:3px solid var(--blue);padding:9px 12px;border-radius:6px;font-size:14px;margin-top:10px;line-height:1.5}
/* Quiz */
.qbox{max-width:760px}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:900;font-size:20px}
.qtag{font-size:12px;color:var(--mut);font-weight:700;text-align:right}
.qbarw{height:6px;background:#1a2647;border-radius:4px;margin:10px 0 4px;overflow:hidden}
.qbar{height:100%;background:linear-gradient(90deg,#ffd24d,#ff4d6d)}
.box h3.qq{font-size:18px;line-height:1.45;margin:12px 0;text-transform:none;letter-spacing:0;color:var(--ink)}
.qopts{list-style:none;padding:0;margin:0}
.qopts li{padding:11px 14px;margin:6px 0;border:1px solid var(--line);border-radius:10px;background:var(--panel2);font-size:15px}
.qopts li b{display:inline-block;width:24px;color:var(--warn)}
.qopts li.good{border-color:var(--acc);background:#0d2a22}.qopts li.bad{border-color:var(--bad);background:#2a0f19}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;margin-left:8px;vertical-align:middle}
.qplayers{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
.qp{flex:1;min-width:220px;border:2px solid;border-radius:12px;padding:8px 10px;background:var(--panel2)}
.qpn{font-weight:900;margin-bottom:6px}
.qbtns{display:flex;gap:6px}
.qbtns button{flex:1;font-size:20px;font-weight:900;padding:10px 0;border-radius:10px;border:1px solid var(--line);background:#14214a;color:var(--ink);cursor:pointer;touch-action:manipulation}
.qbtns button small{display:block;font-size:10px;color:var(--mut);font-weight:600}
.qlock{color:var(--mut);font-weight:700;padding:10px 0}
.qres{font-weight:800;padding:6px 0}.qres.ok{color:var(--acc)}.qres.ko{color:#ff8fa3}
#rot{display:none;color:var(--warn);font-size:13px;text-align:center}
@media(orientation:portrait) and (max-width:700px){#rot{display:block}}
@media(max-width:640px){.legend{grid-template-columns:1fr}.box{padding:14px}.pad button{font-size:20px;padding:10px 0}.qq{font-size:16px}}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="cv" width="960" height="640"></canvas>
  <div id="rot"></div>
  <div class="pads">
    <div class="pad" id="pad1"><span class="who"></span><button data-a="up" aria-label="up">▲</button><button data-a="frr" aria-label="FRR">⚡</button><button data-a="down" aria-label="down">▼</button></div>
    <div class="pad" id="pad2" style="display:none"><button data-a="up" aria-label="up">▲</button><button data-a="frr" aria-label="FRR">⚡</button><button data-a="down" aria-label="down">▼</button><span class="who">J2</span></div>
  </div>
</div>
<div id="ov" class="ov"><div class="box" id="box"></div></div>
<div id="qz" class="ov"><div class="box qbox" id="qbox"></div></div>
<script src="js/i18n.js"></script>
<script src="js/worlds.js"></script>
<script src="js/quiz.js"></script>
<script src="js/game.js"></script>
</body>
</html>
